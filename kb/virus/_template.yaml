# Plantilla para la base de conocimiento de virus (fase 0).
# Regla: todo campo con contenido biológico carga su propia cita.
# Sin cita, el valor se queda en null y el vacío pasa a open_questions.
# Copia este archivo a kb/virus/<virus_id>.yaml y rellénalo.

virus_id: example-strain
species: Nombre de la especie
strain: Nombre de la cepa
genome: dsDNA | ssRNA- | ssRNA+ | dsRNA
engineered: false
engineering_notes: null   # qué se insertó o se eliminó, con una cita

entry:
  receptors:
    - gene_symbol: CD46
      role: primary | alternative
      evidence_doi: null
  notes: null

interferon_sensitivity:
  # Qué le pasa a este virus en un tumor con una respuesta de interferón tipo I
  # intacta.
  level: high | moderate | low | unknown
  isg_signature_applies: true | false | unknown
  # El signo de la asociación no es el mismo para todos los virus, así que se
  # registra explícitamente en vez de asumirlo.
  signature_direction: resistance | susceptibility | unknown
  evidence_doi: null

pathway_dependencies:
  - pathway: RAS/MEK
    relation: required | exploits_loss
    evidence_doi: null

normal_tissue_tropism:
  summary: null
  evidence_doi: null

clinical_status:
  stage: preclinical | phase_1 | phase_2 | phase_3 | approved
  indications: []
  evidence_doi: null

curation:
  added: null          # AAAA-MM-DD
  last_reviewed: null  # AAAA-MM-DD
  extracted_by: human | agent
  reviewed_by_human: false

open_questions:
  - Qué queda por curar para este virus
