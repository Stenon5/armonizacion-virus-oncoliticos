[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armonizacion-virus-oncoliticos"
version = "0.0.0"
description = "Esquema y herramientas para armonizar resultados publicados de tamizaje de virus oncolíticos. Andamiaje, todavía sin datos."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Stenon5" }]
keywords = ["virus oncolítico", "armonización de datos", "reproducibilidad"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Stenon5/armonizacion-virus-oncoliticos"

[project.scripts]
ovh-validate = "ovh.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
